<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 改动：去掉了 maximum-scale=1.0 和 user-scalable=no，这样用户可以双指缩放页面（对视力不好的人很重要） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="复习日程">
<meta name="theme-color" content="#0e7490">
<meta name="description" content="艾宾浩斯遗忘曲线复习提示工具">
<title>艾宾浩斯复习日程</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<!-- 改动：先加载共用样式（../ 表示上一级目录），再加载应用专用样式 app.css -->
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="app.css">
</head>
<!-- 改动：body 加了 app-page，让应用页面固定为一屏高、内容区自己滚动 -->
<body class="app-page">
<!-- 改动：顶部加入全站共用的导航栏（和其他页面是同一段代码，当前页用 aria-current 标记） -->
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="../index.html"><img class="brand-icon" src="../favicon.svg" alt=""> <span>艾宾浩斯复习日程</span></a>
    <nav class="nav-links" aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="index.html" aria-current="page">开始复习</a>
      <a href="../guide.html">使用指南</a>
      <a href="../privacy.html">隐私说明</a>
      <a href="../about.html">关于</a>
    </nav>
  </div>
</header>
<div class="app" id="app"></div>
<script>
// ========== DATA LAYER ==========
const REVIEW_INTERVALS = [1,2,4,7,15,30];
const REVIEW_LABELS = ['1天后','2天后','4天后','7天后','15天后','30天后'];
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const LS_KEY = 'ebbinghaus-pwa-v1';

function dateToKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function keyToDate(k){ const p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]) }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate() }
function retentionRate(days){ return Math.max(0.2,Math.exp(-0.3*days)) }

let state = {
  entries: {},
  completed: {},
  currentMonth: new Date().getMonth(),
  currentYear: new Date().getFullYear(),
  selectedDate: new Date(),
  inputText: '',
  showStats: false,
  showModal: false,
  dismissedDate: ''
};

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.entries = d.entries||{};
      state.completed = d.completed||{};
    }
  }catch(e){}
}
function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({entries:state.entries,completed:state.completed}));
  }catch(e){}
}

function getReviewMap(){
  const map={};
  Object.keys(state.entries).forEach(dk=>{
    const items=state.entries[dk];
    const ld=keyToDate(dk);
    REVIEW_INTERVALS.forEach((interval,idx)=>{
      const rd=addDays(ld,interval);
      const rk=dateToKey(rd);
      if(!map[rk])map[rk]=[];
      items.forEach(item=>{
        map[rk].push({content:item,learnedOn:dk,reviewRound:idx+1,interval});
      });
    });
  });
  return map;
}

function isCompleted(dk,content,learnedOn){
  return !!state.completed[dk+'::'+learnedOn+'::'+content];
}
function toggleCompleted(dk,content,learnedOn){
  const k=dk+'::'+learnedOn+'::'+content;
  if(state.completed[k]) delete state.completed[k];
  else state.completed[k]=true;
  saveState(); render();
}

function getOverdue(rMap){
  const today=new Date(); const arr=[];
  Object.keys(rMap).forEach(dk=>{
    const d=keyToDate(dk);
    if(d<today&&!sameDay(d,today)){
      rMap[dk].forEach(r=>{
        if(!state.completed[dk+'::'+r.learnedOn+'::'+r.content])
          arr.push({...r,dueDate:dk});
      });
    }
  });
  return arr;
}

function getStreak(rMap){
  const today=new Date(); let count=0; let cd=new Date(today);
  const tKey=dateToKey(cd); const tRevs=rMap[tKey]||[]; const tLearned=state.entries[tKey]||[];
  if(!tRevs.length&&!tLearned.length) cd=addDays(cd,-1);
  else if(tRevs.length){
    const allDone=tRevs.every(r=>state.completed[tKey+'::'+r.learnedOn+'::'+r.content]);
    if(!allDone) cd=addDays(cd,-1);
  }
  for(let i=0;i<365;i++){
    const dk=dateToKey(cd); const revs=rMap[dk]||[]; const learned=state.entries[dk]||[];
    if(!revs.length&&!learned.length) break;
    if(revs.length){
      const allDone=revs.every(r=>state.completed[dk+'::'+r.learnedOn+'::'+r.content]);
      if(!allDone) break;
    }
    count++; cd=addDays(cd,-1);
  }
  return count;
}

function getCalDays(y,m){
  const first=new Date(y,m,1); const last=new Date(y,m+1,0); const days=[];
  for(let i=first.getDay()-1;i>=0;i--) days.push({date:new Date(y,m,-i),outside:true});
  for(let i=1;i<=last.getDate();i++) days.push({date:new Date(y,m,i),outside:false});
  const rem=42-days.length;
  for(let i=1;i<=rem;i++) days.push({date:new Date(y,m+1,i),outside:true});
  return days;
}

// ========== RENDER ==========
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(k=>{
    if(k==='onclick'||k==='oninput'||k==='onchange') el.addEventListener(k.slice(2),attrs[k]);
    else if(k==='className') el.className=attrs[k];
    else if(k==='style'&&typeof attrs[k]==='object'){
      Object.assign(el.style,attrs[k]);
    }
    else el.setAttribute(k,attrs[k]);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false)return;
    if(typeof c==='string'||typeof c==='number') el.appendChild(document.createTextNode(c));
    else if(c instanceof Node) el.appendChild(c);
  });
  return el;
}

function render(){
  const today=new Date();
  const todayKey=dateToKey(today);
  const rMap=getReviewMap();
  const overdue=getOverdue(rMap);
  const streak=getStreak(rMap);
  const selKey=dateToKey(state.selectedDate);
  const dayReviews=rMap[selKey]||[];
  const dayLearned=state.entries[selKey]||[];
  const calDays=getCalDays(state.currentYear,state.currentMonth);
  const isToday=sameDay(state.selectedDate,today);
  const todayRevs=rMap[todayKey]||[];
  const todayDone=todayRevs.filter(r=>isCompleted(todayKey,r.content,r.learnedOn)).length;
  const totalLearned=Object.values(state.entries).reduce((s,a)=>s+a.length,0);
  const totalCompleted=Object.keys(state.completed).length;

  // Auto show modal
  if(!state.showModal && state.dismissedDate!==todayKey && (todayRevs.length>0||overdue.length>0)){
    state.showModal=true;
  }

  const app=document.getElementById('app');
  app.innerHTML='';

  // == Modal ==
  if(state.showModal){
    const dismiss=()=>{ state.showModal=false; state.dismissedDate=todayKey; render(); };
    const overlay=h('div',{className:'modal-overlay',onclick:dismiss});
    const modal=h('div',{className:'modal',onclick:e=>e.stopPropagation()},
      // Header
      h('div',{className:'modal-header'},
        h('div',null,
          h('h2',null,(todayRevs.length>0?'📋':'✅')+' 今日复习摘要'),
          h('p',{className:'date'},today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日 周'+WEEKDAYS[today.getDay()])
        ),
        h('button',{className:'modal-close',onclick:dismiss},'✕')
      ),
      // Streak
      streak>0?h('div',{className:'streak-bar'},
        h('span',{className:'streak-fire',style:{fontSize:'18px'}},'🔥'),
        h('span',null,'连续坚持 ',h('strong',null,streak),' 天'),
        h('span',{className:'msg'},streak>=30?'太强了！':streak>=14?'继续保持！':streak>=7?'一周达成！':'加油！')
      ):null,
      // Summary
      h('div',{className:'modal-summary'},
        h('div',{className:'card',style:{borderColor:'rgba(14,116,144,0.15)'}},
          h('div',{className:'num',style:{color:'#0e7490'}},todayRevs.length),
          h('div',{className:'lbl'},'今日待复习')
        ),
        h('div',{className:'card',style:{borderColor:'rgba(16,185,129,0.15)'}},
          h('div',{className:'num',style:{color:'#10b981'}},todayDone),
          h('div',{className:'lbl'},'已完成')
        ),
        h('div',{className:'card',style:{borderColor:overdue.length>0?'rgba(239,68,68,0.15)':'rgba(16,185,129,0.15)'}},
          h('div',{className:'num',style:{color:overdue.length>0?'#ef4444':'#10b981'}},overdue.length),
          h('div',{className:'lbl'},'逾期未复习')
        )
      ),
      // Today list
      todayRevs.length>0?h('div',{className:'modal-list'},
        h('h4',null,'📌 今日复习内容'),
        h('div',{className:'modal-list-scroll'},
          ...(() => {
            const groups={};
            todayRevs.forEach(r=>{ if(!groups[r.learnedOn])groups[r.learnedOn]=[]; groups[r.learnedOn].push(r); });
            return Object.keys(groups).sort().map(lk=>{
              const ld=keyToDate(lk); const items=groups[lk];
              return h('div',{className:'modal-group'},
                h('div',{className:'modal-group-head'},
                  h('span',null,'学于 '+(ld.getMonth()+1)+'/'+ld.getDate()),
                  h('span',{className:'review-round'},'第'+items[0].reviewRound+'次')
                ),
                ...items.map(r=>{
                  const done=isCompleted(todayKey,r.content,r.learnedOn);
                  return h('div',{className:'modal-item',style:{background:done?'rgba(16,185,129,0.05)':'rgba(251,191,36,0.05)'}},
                    h('div',{className:'check-box',onclick:()=>toggleCompleted(todayKey,r.content,r.learnedOn),style:{background:done?'#10b981':'transparent',borderColor:done?'#10b981':'#cbd5e1',color:'#fff'}},done?'✓':''),
                    h('span',{style:{fontSize:'14px',color:'#334155',flex:'1',textDecoration:done?'line-through':'none',opacity:done?'0.5':'1'}},r.content)
                  );
                })
              );
            });
          })()
        )
      ):null,
      // Overdue
      overdue.length>0?h('div',{className:'modal-overdue'},
        h('h4',null,'⚠️ 逾期未复习 ('+overdue.length+'项)'),
        h('p',{className:'hint'},'以下内容已过复习日期，建议尽快补习'),
        h('div',{className:'modal-list-scroll'},
          ...overdue.slice(0,10).map(r=>
            h('div',{className:'modal-overdue-item'},
              h('span',{style:{flex:'1'}},r.content),
              h('span',{className:'meta'},'原定 '+(keyToDate(r.dueDate).getMonth()+1)+'/'+keyToDate(r.dueDate).getDate())
            )
          ),
          overdue.length>10?h('p',{style:{fontSize:'13px',color:'#64748b',textAlign:'center',marginTop:'5px'}},'还有 '+(overdue.length-10)+' 项...'):null
        )
      ):null,
      // Button
      h('button',{className:'modal-start-btn',onclick:dismiss},todayRevs.length-todayDone>0?'开始复习 →':'知道了 👍')
    );
    overlay.appendChild(modal);
    app.appendChild(overlay);
  }

  // == Header ==
  const header=h('div',{className:'header'},
    h('div',{className:'header-inner'},
      h('div',{className:'logo'},
        h('h1',null,'🧠 艾宾浩斯复习日程'),
      ),
      h('div',{className:'header-btns'},
        streak>0?h('div',{className:'streak-badge'},h('span',{className:'streak-fire'},'🔥'),streak+'天'):null,
        overdue.length>0?h('button',{className:'hbtn danger'},'⚠️ '+overdue.length+'项逾期'):null,
        h('button',{className:'hbtn warn',onclick:()=>{state.showModal=true;render();}},'📋 今日摘要'),
        h('button',{className:'hbtn',onclick:()=>{state.showStats=!state.showStats;render();}},state.showStats?'✕ 关闭':'📊 统计')
      )
    ),
    // Stats
    state.showStats?h('div',{className:'stats-panel'},
      h('div',{className:'stat-card'},h('div',{className:'stat-num'},totalLearned),h('div',{className:'stat-label'},'已学内容')),
      h('div',{className:'stat-card'},h('div',{className:'stat-num'},Object.keys(state.entries).length),h('div',{className:'stat-label'},'学习天数')),
      h('div',{className:'stat-card'},h('div',{className:'stat-num',style:{color:'#10b981'}},totalCompleted),h('div',{className:'stat-label'},'已完成复习')),
      h('div',{className:'stat-card'},h('div',{className:'stat-num',style:{color:todayRevs.length-todayDone>0?'#f59e0b':'#10b981'}},todayRevs.length-todayDone),h('div',{className:'stat-label'},'今日待复习'))
    ):null,
    // Today banner
    todayRevs.length>0?h('div',{className:'today-banner'},
      h('span',null,'📌 今日有 ',h('strong',null,todayRevs.length),' 项需要复习，已完成 ',h('strong',null,todayDone),' 项'),
      !sameDay(state.selectedDate,today)?h('button',{className:'cal-today-btn',onclick:()=>{state.selectedDate=today;state.currentMonth=today.getMonth();state.currentYear=today.getFullYear();render();}},'查看今日'):null
    ):null
  );
  app.appendChild(header);

  // == Main ==
  const main=h('div',{className:'main'});
  const grid=h('div',{className:'main-grid'});

  // -- Calendar column --
  const calCol=h('div',{className:'cal-section'});

  // Calendar card
  const calCard=h('div',{className:'cal-card'});
  const calNav=h('div',{className:'cal-nav'},
    h('button',{onclick:()=>{if(state.currentMonth===0){state.currentMonth=11;state.currentYear--}else state.currentMonth--;render();}},'‹'),
    h('div',{className:'cal-title'},
      h('span',{className:'year'},state.currentYear),
      h('span',{className:'month'},MONTHS[state.currentMonth])
    ),
    h('button',{onclick:()=>{if(state.currentMonth===11){state.currentMonth=0;state.currentYear++}else state.currentMonth++;render();}},'›'),
    h('button',{className:'cal-today-btn',onclick:()=>{state.currentMonth=today.getMonth();state.currentYear=today.getFullYear();state.selectedDate=today;render();}},'今天')
  );
  calCard.appendChild(calNav);

  const weekRow=h('div',{className:'week-row'});
  WEEKDAYS.forEach(w=>weekRow.appendChild(h('div',{className:'week-label'},w)));
  calCard.appendChild(weekRow);

  const daysGrid=h('div',{className:'days-grid'});
  calDays.forEach(day=>{
    const dk=dateToKey(day.date);
    const hasL=!!state.entries[dk];
    const hasR=!!(rMap[dk]&&rMap[dk].length);
    const isSel=sameDay(day.date,state.selectedDate);
    const isTd=sameDay(day.date,today);
    const rc=(rMap[dk]||[]).length;
    const dc=(rMap[dk]||[]).filter(r=>isCompleted(dk,r.content,r.learnedOn)).length;
    const allDone=rc>0&&dc===rc;
    const isPast=day.date<today&&!isTd;

    let cls='day-cell';
    if(isSel)cls+=' selected';
    else if(isTd)cls+=' today';
    if(day.outside)cls+=' outside';

    const cell=h('div',{className:cls,onclick:()=>{state.selectedDate=day.date;render();}},
      h('span',null,day.date.getDate()),
      h('div',{className:'dot-row'},
        hasL?h('div',{className:'dot',style:{background:isSel?'rgba(255,255,255,0.9)':'#0e7490'}}):null,
        hasR?h('div',{className:'dot',style:{background:isSel?'rgba(255,255,255,0.7)':allDone?'#10b981':isPast?'#ef4444':'#f59e0b'}}):null
      )
    );
    daysGrid.appendChild(cell);
  });
  calCard.appendChild(daysGrid);

  const legend=h('div',{className:'legend'},
    h('div',{className:'legend-item'},h('div',{className:'dot',style:{background:'#0e7490'}}),' 已学'),
    h('div',{className:'legend-item'},h('div',{className:'dot',style:{background:'#f59e0b'}}),' 待复习'),
    h('div',{className:'legend-item'},h('div',{className:'dot',style:{background:'#10b981'}}),' 已完成'),
    h('div',{className:'legend-item'},h('div',{className:'dot',style:{background:'#ef4444'}}),' 逾期')
  );
  calCard.appendChild(legend);
  calCol.appendChild(calCard);

  // Curve
  const curveCard=h('div',{className:'curve-card'});
  curveCard.innerHTML='<h3>🔬 记忆保持率</h3><p>每次复习都会强化记忆连接</p><svg viewBox="0 0 300 100" style="width:100%;height:auto"><!-- 改动：高度改为自动，图里的字不再被压得很小 --><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0e7490" stop-opacity="0.3"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0"/></linearGradient></defs><line x1="30" y1="85" x2="290" y2="85" stroke="#e2e8f0" stroke-width="1"/><line x1="30" y1="10" x2="30" y2="85" stroke="#e2e8f0" stroke-width="1"/><path d="M30,15 Q80,20 120,55 Q160,75 290,80" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,4"/><path d="M30,15 L60,30 L60,18 L90,33 L90,16 L150,35 L150,14 L210,28 L210,13 L290,22" fill="none" stroke="#0e7490" stroke-width="2.5"/><path d="M30,15 L60,30 L60,18 L90,33 L90,16 L150,35 L150,14 L210,28 L210,13 L290,22 L290,85 L30,85 Z" fill="url(#cg)"/><text x="160" y="97" text-anchor="middle" font-size="12" fill="#64748b">时间 →</text><text x="155" y="72" font-size="12" fill="#dc2626">不复习</text><text x="248" y="18" font-size="12" fill="#0e7490">定期复习</text></svg>';
  calCol.appendChild(curveCard);

  grid.appendChild(calCol);

  // -- Detail column --
  const detailCol=h('div',{className:'detail-section'});

  // Date header
  detailCol.appendChild(h('div',{className:'date-header'},
    h('h2',null,state.selectedDate.getFullYear()+'年'+(state.selectedDate.getMonth()+1)+'月'+state.selectedDate.getDate()+'日',
      h('span',{className:'date-weekday'},' 周'+WEEKDAYS[state.selectedDate.getDay()])
    ),
    isToday?h('span',{className:'today-tag'},'今天'):null
  ));

  // Input
  const inputCard=h('div',{className:'input-card'},
    h('div',{className:'input-header'},
      h('span',null,'✏️'),
      h('span',{style:{fontWeight:'600'}},'记录学习内容'),
      h('span',{className:'hint'},'每行一个知识点')
    )
  );
  const ta=h('textarea',{placeholder:'在这里输入今天学到的内容...\n例如：\n英语单词：abandon, abolish\n数学：导数的基本公式',rows:'4',oninput:e=>{state.inputText=e.target.value}});
  ta.value=state.inputText;
  inputCard.appendChild(ta);
  const addBtn=h('button',{className:'add-btn',onclick:()=>{
    if(!state.inputText.trim())return;
    const k=selKey;
    if(!state.entries[k])state.entries[k]=[];
    state.inputText.split('\n').filter(l=>l.trim()).forEach(l=>state.entries[k].push(l.trim()));
    state.inputText='';
    saveState(); render();
  }},'＋ 添加到 '+(state.selectedDate.getMonth()+1)+'月'+state.selectedDate.getDate()+'日');
  if(!state.inputText.trim()) addBtn.disabled=true;
  inputCard.appendChild(addBtn);
  detailCol.appendChild(inputCard);

  // Learned items
  if(dayLearned.length>0){
    const sec=h('div',{className:'section-card'},
      h('div',{className:'section-title'},
        h('span',{className:'section-dot',style:{background:'#0e7490'}}),
        '当日学习 · '+dayLearned.length+'项'
      )
    );
    dayLearned.forEach((item,idx)=>{
      sec.appendChild(h('div',{className:'learn-item'},
        h('span',{style:{flex:'1'}},item),
        h('button',{className:'del-btn',onclick:()=>{
          state.entries[selKey]=state.entries[selKey].filter((_,i)=>i!==idx);
          if(state.entries[selKey].length===0)delete state.entries[selKey];
          saveState(); render();
        }},'✕')
      ));
    });
    // Schedule preview
    const preview=h('div',{className:'schedule-preview'},h('p',{className:'label'},'📅 复习安排'));
    const tags=h('div',{className:'schedule-tags'});
    REVIEW_INTERVALS.forEach((interval,i)=>{
      const rd=addDays(state.selectedDate,interval);
      const isPast=rd<today;
      tags.appendChild(h('span',{className:'schedule-tag',style:{
        background:isPast?'rgba(239,68,68,0.08)':'rgba(14,116,144,0.08)',
        color:isPast?'#ef4444':'#0e7490',
        borderColor:isPast?'rgba(239,68,68,0.15)':'rgba(14,116,144,0.15)'
      },onclick:()=>{state.selectedDate=rd;state.currentMonth=rd.getMonth();state.currentYear=rd.getFullYear();render();}},
        (rd.getMonth()+1)+'/'+rd.getDate()+' ('+REVIEW_LABELS[i]+')'
      ));
    });
    preview.appendChild(tags);
    sec.appendChild(preview);
    detailCol.appendChild(sec);
  }

  // Review items
  if(dayReviews.length>0){
    const doneTotal=dayReviews.filter(r=>isCompleted(selKey,r.content,r.learnedOn)).length;
    const sec=h('div',{className:'section-card'},
      h('div',{className:'section-title'},
        h('span',{className:'section-dot',style:{background:'#f59e0b'}}),
        '需要复习 · '+dayReviews.length+'项',
        h('span',{className:'done-count'},'已完成 '+doneTotal+'/'+dayReviews.length)
      )
    );
    const groups={};
    dayReviews.forEach(r=>{ if(!groups[r.learnedOn])groups[r.learnedOn]=[]; groups[r.learnedOn].push(r); });
    Object.keys(groups).sort().forEach(lk=>{
      const ld=keyToDate(lk); const items=groups[lk]; const rr=retentionRate(items[0].interval);
      const grp=h('div',{className:'review-group'},
        h('div',{className:'review-group-head'},
          h('span',null,'学于 '+(ld.getMonth()+1)+'/'+ld.getDate()),
          h('span',{className:'review-round'},'第'+items[0].reviewRound+'次复习'),
          h('div',{className:'retention-bar'},h('div',{className:'retention-fill',style:{width:(rr*100)+'%',background:rr>0.5?'#10b981':rr>0.3?'#f59e0b':'#ef4444'}})),
          h('span',{className:'retention-text'},Math.round(rr*100)+'%')
        )
      );
      items.forEach(r=>{
        const done=isCompleted(selKey,r.content,r.learnedOn);
        grp.appendChild(h('div',{className:'review-item',style:{
          background:done?'rgba(16,185,129,0.04)':'rgba(251,191,36,0.04)',
          borderColor:done?'rgba(16,185,129,0.15)':'rgba(251,191,36,0.15)'
        }},
          h('div',{className:'check-box',onclick:()=>toggleCompleted(selKey,r.content,r.learnedOn),style:{
            background:done?'#10b981':'transparent',
            borderColor:done?'#10b981':'#cbd5e1',color:'#fff',fontSize:'13px',fontWeight:'700'
          }},done?'✓':''),
          h('span',{className:'review-text',style:{textDecoration:done?'line-through':'none',opacity:done?'0.5':'1',flex:'1'}},r.content)
        ));
      });
      sec.appendChild(grp);
    });
    detailCol.appendChild(sec);
  }

  // Empty
  if(dayLearned.length===0&&dayReviews.length===0){
    detailCol.appendChild(h('div',{className:'empty-state'},
      h('div',{className:'icon'},'📖'),
      h('p',{className:'text'},'这一天暂无学习或复习内容'),
      h('p',{className:'hint'},'在上方输入框添加学习内容，系统会自动生成复习计划')
    ));
  }

  // Ref card
  const refCard=h('div',{className:'ref-card'},h('h4',null,'📐 复习间隔规则'));
  const refGrid=h('div',{className:'ref-grid'});
  REVIEW_INTERVALS.forEach((interval,i)=>{
    refGrid.appendChild(h('div',{className:'ref-item'},
      h('div',{className:'ref-num'},interval),
      h('div',{className:'ref-label'},'天后'),
      h('div',{className:'ref-round'},'第'+(i+1)+'轮')
    ));
  });
  refCard.appendChild(refGrid);
  detailCol.appendChild(refCard);

  grid.appendChild(detailCol);
  main.appendChild(grid);
  app.appendChild(main);
}

// Init
loadState();
render();
</script>
</body>
</html>

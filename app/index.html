<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 没有 user-scalable=no：用户可以双指缩放页面（对视力不好的人很重要） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="复习日程">
<!-- 浏览器顶栏的颜色：日间用纸色，夜间用深色 -->
<meta name="theme-color" content="#eef2e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171f" media="(prefers-color-scheme: dark)">
<meta name="description" content="艾宾浩斯遗忘曲线复习提示工具">
<title>开始复习 - 艾宾浩斯复习日程</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<!-- 先加载共用样式（../ 表示上一级目录），再加载应用专用样式 app.css -->
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="app-page">
<!-- 顶部是全站共用的导航栏（和其他页面是同一段代码，当前页用 aria-current 标记） -->
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="../index.html"><img class="brand-icon" src="../favicon.svg" alt=""> <span>艾宾浩斯复习日程</span></a>
    <nav class="nav-links" aria-label="主导航">
      <a href="../index.html">首页</a>
      <a href="index.html" aria-current="page">开始复习</a>
      <a href="../guide.html">使用指南</a>
      <a href="../privacy.html">隐私说明</a>
      <a href="../about.html">关于</a>
    </nav>
  </div>
</header>

<!-- 整个应用的界面都由 app.js 画在这个 #app 里 -->
<main class="app" id="app"></main>
<noscript><p style="padding:24px">这个页面需要开启 JavaScript 才能使用。</p></noscript>

<!-- 应用的脚本单独放在 app.js 里（原来是直接写在这个文件里的） -->
<script src="app.js"></script>
</body>
</html>
